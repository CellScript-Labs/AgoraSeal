[package]
name = "agoraseal-ckb-state-context"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "agoraseal-ckb-state-context"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ckb-std = { version = "=1.1.0", default-features = false, features = ["allocator", "ckb-types", "type-id"] }
ckb-hash = { version = "=1.1.1", default-features = false, features = ["ckb-contract"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
panic = "abort"
