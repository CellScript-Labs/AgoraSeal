[workspace]
resolver = "3"
members = ["program", "host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
license = "MIT"

[profile.release]
lto = "thin"
overflow-checks = true

# Atomic read/modify/write arithmetic wraps, including in a single-thread VM.
[profile.release.package.ckb-std]
overflow-checks = false
