[package]
name = "agoraseal-prover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "agoraseal-verify-plonk"
path = "src/bin/verify_plonk.rs"

[features]
native-gnark = ["sp1-sdk/native-gnark"]

[dependencies]
agoraseal-protocol = { path = "../../crates/protocol" }
sp1-sdk = "=6.1.0"
sp1-verifier = "=6.1.0"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread"] }
anyhow = "=1.0.104"
